spring.application.name=tiss-guard
server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:5MB}

tissguard.tamanho-maximo-upload-bytes=${TISSGUARD_MAX_UPLOAD_BYTES:5242880}
tissguard.diretorio-artefatos=${TISSGUARD_DIRETORIO_ARTEFATOS:dados/artefatos}
tissguard.timeout-validacao-segundos=${TISSGUARD_TIMEOUT_VALIDACAO_SEGUNDOS:10}
